<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Nubi</title>
<meta name="description" content="Step-by-step payment routes on Coupang, Naver and Baemin for international students before their ARC arrives.">
<meta property="og:title" content="Nubi — payment routes for international students">
<meta property="og:description" content="Tell us your situation in one sentence and get a route you can try now. No sign-up.">
<style>
/* 색은 명세 숫자 그대로. 다크 모드는 같은 의미를 유지하되 대비만 다시 맞춘다. */
:root{
  --bg:#F7F8FA; --card:#FFFFFF; --text:#202020; --sub:#4A4F55; --border:#D9DDE5;
  --accent:#C3002F; --accent-bg:#C3002F; --on-accent:#FFFFFF; --line-off:#8A9099;
  --warn:#F08C00; --warn-bg:#FFF3E0; --warn-text:#7A4600;
  --banner-bg:#FFF4CC; --banner-text:#6B4E00; --vbanner-bg:#E6F4EA; --vbanner-text:#1E6B34;
  --st-verified-bg:#E6F4EA; --st-verified-tx:#1E6B34;
  --st-assumed-bg:#FFF4CC;  --st-assumed-tx:#6B4E00;
  --st-public-bg:#E7EEFB;   --st-public-tx:#1F4E9C;
  --st-reported-bg:#F1E8FB; --st-reported-tx:#5B2B8A;
  --st-pending-bg:#F1F2F5;  --st-pending-tx:#4A4F55;
  --st-blocked-bg:#ECEEF1;  --st-blocked-tx:#202020;
  --focus:#1F4E9C; --user-bg:#202020; --user-tx:#FFFFFF; --ring:#FFFFFF;
  --present-bg:#FFF8E1; --present-tx:#3D3000; --present-bd:#EAD48A; --alt:#1D4F91;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121417; --card:#1C1F24; --text:#ECEDEF; --sub:#B9BFC7; --border:#3A3F47;
    --accent:#FF6B85; --accent-bg:#D11F45; --on-accent:#FFFFFF; --line-off:#8A9099;
    --warn:#F08C00; --warn-bg:#3A2808; --warn-text:#FFC680;
    --banner-bg:#4A3B00; --banner-text:#FFE58A; --vbanner-bg:#1E3A27; --vbanner-text:#A8E0B5;
    --st-verified-bg:#1E3A27; --st-verified-tx:#A8E0B5;
    --st-assumed-bg:#4A3B00;  --st-assumed-tx:#FFE58A;
    --st-public-bg:#1E2C48;   --st-public-tx:#B6CCF5;
    --st-reported-bg:#3A2950; --st-reported-tx:#DCC6F5;
    --st-pending-bg:#2A2D33;  --st-pending-tx:#C6CBD2;
    --st-blocked-bg:#30333A;  --st-blocked-tx:#E4E6EA;
    --focus:#8AB4FF; --user-bg:#ECEDEF; --user-tx:#121417; --ring:#1C1F24;
    --present-bg:#332B12; --present-tx:#F5E9C4; --present-bd:#6B5A1F; --alt:#7FA8E8;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  overflow-wrap:anywhere;word-break:keep-all}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
h1{font-size:26px;line-height:1.3;margin:20px 0 8px}
h2{font-size:22px;line-height:1.35;margin:20px 0 12px}
h3{font-size:18px;line-height:1.4;margin:0 0 8px}
h4{font-size:16px;margin:12px 0 4px}
p{margin:6px 0}
a{color:var(--focus)}
.small{font-size:13px;color:var(--sub);line-height:1.5}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}

/* 배너: 닫기 버튼 없음, 크기 축소 없음 */
.banner{padding:10px 0;font-size:15px;font-weight:700;line-height:1.5;border-bottom:1px solid var(--border)}
.banner-demo{background:var(--banner-bg);color:var(--banner-text)}
.banner-verified{background:var(--vbanner-bg);color:var(--vbanner-text)}
.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px}
.brand{font-weight:800;font-size:18px;color:var(--text);text-decoration:none;margin-right:auto;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.brand-dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{min-height:44px;padding:0 12px;border:0;background:transparent;color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--card)}
.flash{margin:8px 0 0;padding:8px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);font-size:14px}

/* 버튼: 높이 44px 이상, 같은 줄의 버튼은 같은 크기·같은 굵기 */
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:10px 16px;border-radius:10px;
  font:inherit;font-size:16px;font-weight:700;line-height:1.3;cursor:pointer;text-decoration:none;border:2px solid var(--accent-bg)}
.btn-primary{background:var(--accent-bg);color:var(--on-accent)}
.btn-outline{background:var(--card);color:var(--accent)}
.btn-small{min-height:44px;font-size:14px;padding:6px 12px;border-width:1px;border-color:var(--border);background:var(--card);color:var(--text);font-weight:600}
.btn-block{width:100%}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn-row.three{grid-template-columns:1fr 1fr 1fr}
@media (max-width:420px){.btn-row.three{grid-template-columns:1fr}}
.linkbtn{background:none;border:0;padding:0;min-height:44px;font:inherit;font-size:13px;color:var(--focus);text-decoration:underline;cursor:pointer}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin:12px 0}
.tagline{font-size:20px;font-weight:700;line-height:1.45;margin:4px 0 6px}
.q-label{display:block;font-size:22px;font-weight:700;line-height:1.35;margin-bottom:2px}
.hint{font-size:13px;font-weight:700;color:var(--warn-text);background:var(--warn-bg);border-left:4px solid var(--warn);padding:4px 8px;border-radius:4px;margin:8px 0}
textarea{width:100%;min-height:96px;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:16px;line-height:1.5;resize:vertical}
.err{color:var(--accent);font-weight:600;font-size:14px;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px}
.chip{min-height:44px;padding:8px 14px;border-radius:22px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:15px;cursor:pointer;text-align:left}
.chip .v{font-weight:700}
.chip[aria-expanded="true"]{border:2px solid var(--accent)}
.chip-editor{display:flex;flex-wrap:wrap;gap:8px;padding:10px;margin:4px 0 8px;border:1px dashed var(--border);border-radius:10px}
.opt{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--text);color:var(--card)}

/* 버튼형 질문·결제 완료 카드 */
.plat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.answers .btn[aria-pressed="true"]{background:var(--accent-bg);color:var(--on-accent)}
.q-back{margin:4px 0 8px}
.chip.static{cursor:default;display:inline-flex;align-items:center;min-height:32px;padding:4px 12px;font-weight:700}
.pay-done-title{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;color:var(--st-verified-tx);margin:4px 0}
.pay-done-icon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--st-verified-tx);color:var(--card);font-size:20px;flex:none}
.pay-done-sub{font-size:16px;margin:4px 0 10px}
.pay-sep{border:0;border-top:1px solid var(--border);margin:12px 0}
.privacy-box{display:flex;gap:8px;font-size:13px;color:var(--sub);background:var(--st-pending-bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;line-height:1.5}

/* 대화 */
.chat{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.bubble{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.5}
.bubble p{margin:2px 0}
.bot{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;align-self:flex-start}
.user{background:var(--user-bg);color:var(--user-tx);border-bottom-right-radius:4px;align-self:flex-end}
.who{font-size:12px;opacity:.85;display:block;margin-bottom:2px}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
@media (max-width:380px){.answers{grid-template-columns:1fr}}
.note-line{font-size:14px;color:var(--sub);margin:8px 0}

/* 배지 */
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.badge{display:inline-flex;align-items:center;font-size:13px;font-weight:700;line-height:1.3;padding:3px 8px;border-radius:6px;border:1px solid transparent}
.st-verified,.st-tested{background:var(--st-verified-bg);color:var(--st-verified-tx)}
.st-guide{background:var(--st-public-bg);color:var(--st-public-tx)}
.st-unknown{background:var(--st-pending-bg);color:var(--st-pending-tx);border-color:var(--border)}
.st-assumed{background:var(--st-assumed-bg);color:var(--st-assumed-tx)}
.st-public{background:var(--st-public-bg);color:var(--st-public-tx)}
.st-reported{background:var(--st-reported-bg);color:var(--st-reported-tx)}
.st-pending{background:var(--st-pending-bg);color:var(--st-pending-tx);border-color:var(--border)}
.st-blocked{background:var(--st-blocked-bg);color:var(--st-blocked-tx);border:1px dashed var(--line-off)}
.type-a{background:var(--accent-bg);color:var(--on-accent)}
.partner-label{display:inline-block;font-size:12px;font-weight:400;color:var(--sub);border:1px solid var(--border);border-radius:4px;padding:0 5px;line-height:1.5}
.partner{font-size:12px;color:var(--sub);margin-top:12px}
.warn{font-size:13px;color:var(--warn-text);background:var(--warn-bg);border-left:4px solid var(--warn);padding:3px 8px;border-radius:4px;margin:4px 0}
.missing{font-size:14px;font-weight:700;color:var(--accent);margin:4px 0}
.stopline{font-size:14px;font-weight:600;color:var(--sub);margin:4px 0}
.info-btn{min-width:44px;min-height:44px;margin:-10px -8px -10px 0;border:none;background:none;color:var(--sub);font-size:18px;line-height:1;cursor:pointer;border-radius:50%}
.info-btn[aria-expanded="true"]{color:var(--accent)}
.info-panel{font-size:13px;color:var(--sub);background:var(--st-pending-bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:6px 0;overflow-wrap:anywhere}
.info-panel p{margin:2px 0}
.consent-list{padding-left:18px;margin:6px 0}
.consent-list li{margin:2px 0}
.basis-line{margin:8px 2px}
.skip{font-size:14px;font-weight:700;color:var(--st-assumed-tx);background:var(--st-assumed-bg);display:inline-block;padding:2px 8px;border-radius:6px;margin:4px 0}
.why{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--border)}
.card-foot{font-size:13px;color:var(--sub);margin:4px 0 16px}
.result-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.result-head h3{margin:0}

/* 세로 노선도: 4px 선, 20px 정거장, 현재 24px + 흰 테두리 3px */
.line{list-style:none;margin:16px 0 0;padding:0}
.stn{position:relative;padding:0 0 18px 44px;min-height:44px}
.stn::before{content:"";position:absolute;left:16px;top:10px;bottom:0;border-left:4px solid var(--accent)}
.stn.seg-off::before{border-left:4px dashed var(--line-off)}
.stn.dest::before{display:none}
.dot{position:absolute;left:8px;top:0;width:20px;height:20px;border-radius:50%;background:var(--accent);z-index:1;box-sizing:border-box}
.st-stopped .dot,.st-after .dot,.dest.unreached .dot{background:var(--card);border:3px solid var(--line-off)}
.st-skipped .dot{background:var(--st-blocked-bg);border:3px solid var(--line-off)}
.st-skipped .dot::after{content:"";position:absolute;left:2px;right:2px;top:5px;border-top:3px solid var(--line-off);transform:rotate(-45deg)}
.stn.current .dot{left:6px;top:-2px;width:24px;height:24px;border:3px solid var(--ring);box-shadow:0 0 0 2px var(--accent)}
.stn.done .dot::after{content:"✓";position:absolute;inset:0;color:var(--on-accent);font-size:12px;font-weight:800;line-height:20px;text-align:center}
.dest.reached .dot{background:var(--accent);box-shadow:0 0 0 3px var(--ring),0 0 0 5px var(--accent)}
.stn-head{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.stn-title{font-weight:700;font-size:16px}
.tag{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:0 6px}
.tag.nv{color:var(--sub);border-color:var(--sub);font-weight:600}
details.og{margin:2px 0 4px;font-size:13px;color:var(--sub)}details.og summary{cursor:pointer;min-height:24px}details.og p{margin:4px 0 0}
.st-after .stn-title,.st-stopped .stn-title{color:var(--sub)}
.ev{margin:2px 0}

/* 단계 안내 */
.progress{height:8px;border-radius:4px;background:var(--st-pending-bg);overflow:hidden;margin:6px 0 4px;border:1px solid var(--border)}
.progress>span{display:block;height:100%;background:var(--accent-bg)}
.step-card ol{padding-left:22px;margin:6px 0}
.step-card li{margin:4px 0}
.openrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.panel{border-top:1px solid var(--border);margin-top:14px;padding-top:12px}
.done-msg{font-size:18px;font-weight:700}

/* 비교표: 칸 배경은 상태색 + 배지 문구 병행 */
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.cmp-table{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed;margin:4px -4px}
.cmp-table th{font-size:13px;text-align:left;color:var(--sub);font-weight:700;padding:4px 6px;vertical-align:bottom}
.cmp-table td{vertical-align:top;padding:6px 7px;border-radius:8px;font-size:13px;border:1px solid var(--border);background:var(--card);line-height:1.45}
.cmp-table col.c1{width:19%}.cmp-table col.c2,.cmp-table col.c3,.cmp-table col.c4{width:21%}.cmp-table col.c5{width:18%}
.cmp-table tbody tr{cursor:pointer}
.cmp-table tr.hl td{border:2px solid var(--accent)}
.bg-verified,.bg-tested{background:var(--st-verified-bg)!important}
.bg-guide{background:var(--st-public-bg)!important}
.bg-unknown{background:var(--st-pending-bg)!important}
/* 실사용: 물건 찾기·공유 동의·설문 */
.item-links{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.item-in{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:16px}
.share-card{border:2px solid var(--border)}
.survey fieldset{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:12px 0}
.survey legend{font-weight:700;padding:0 4px}
.survey .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.bg-assumed{background:var(--st-assumed-bg)!important}
.bg-public{background:var(--st-public-bg)!important}
.bg-reported{background:var(--st-reported-bg)!important}
.bg-pending{background:var(--st-pending-bg)!important}
.bg-blocked{background:var(--st-blocked-bg)!important}
.cell-line{margin:2px 0;color:var(--text);line-height:1.4}
.cmp-table .badges{margin:0 0 2px}
.cmp-table th .tag{display:inline-block;margin-top:2px}
.rowbtn{background:none;border:0;padding:0;min-height:44px;text-align:left;font:inherit;font-size:14px;line-height:1.35;font-weight:700;color:var(--text);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.cmp-cards{display:none}
.cmp-card dl{margin:8px 0 0}
.cmp-card dt{font-size:13px;color:var(--sub);font-weight:700;margin-top:8px}
.cmp-card dd{margin:2px 0 0;padding:6px 8px;border-radius:8px;font-size:13px}
.cmp-card.hl{border:2px solid var(--accent)}
.cmp-card .rowbtn{font-size:16px}
@media (max-width:600px){ .cmp-table{display:none} .cmp-cards{display:block} }
.presenter{margin:24px 0}
.presenter summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700}
.presenter table{width:100%;border-collapse:collapse;font-size:13px}
.presenter td,.presenter th{border:1px solid var(--border);padding:6px;text-align:left;vertical-align:top}
.presenter ul{padding-left:20px;margin:4px 0}

/* 경로 재탐색: 막힌 정거장 회색 X, 갈아탄 경로는 다른 색 선 */
.line.alt .stn::before{border-left-color:var(--alt)}
.line.alt .stn.seg-off::before{border-left:4px dashed var(--line-off)}
.line.alt .dot{background:var(--alt)}
.line.alt .st-stopped .dot,.line.alt .st-after .dot,.line.alt .dest.unreached .dot{background:var(--card);border:3px solid var(--line-off)}
.line.alt .st-skipped .dot{background:var(--st-blocked-bg);border:3px solid var(--line-off)}
.line.alt .stn.current .dot{box-shadow:0 0 0 2px var(--alt)}
.line.alt .dest.reached .dot{background:var(--alt);box-shadow:0 0 0 3px var(--ring),0 0 0 5px var(--alt)}
.line.alt .tag{color:var(--alt);border-color:var(--alt)}
.line.old{margin-bottom:0}
.line.old + .line{margin-top:0}
.stn.to-alt::before,.stn.transfer::before{border-left:4px solid var(--alt)!important}
.stn.stuck-x .dot{left:8px!important;top:0!important;width:20px!important;height:20px!important;background:var(--card)!important;border:3px solid var(--line-off)!important;box-shadow:none!important}
.stn.stuck-x .dot::after{content:"✕";position:absolute;inset:0;color:var(--line-off);font-size:11px;font-weight:900;line-height:14px;text-align:center}
.stn.transfer .dot{background:var(--alt);border-radius:5px}
.stn.transfer .stn-title{color:var(--alt)}
/* 선불 유심 우회: 본선 옆 지선 */
.stn.detour{padding-left:78px}
.stn.detour .dot{left:42px}
.stn.detour.current .dot{left:40px}
.stn.detour::after{content:"";position:absolute;left:18px;top:8px;width:28px;border-top:4px solid var(--accent)}
.stn.detour.st-stopped::after,.stn.detour.st-after::after{border-top:4px dashed var(--line-off)}
.line.alt .stn.detour::after{border-top-color:var(--alt)}
/* 한국어 화면 문구·준비물·묻기 */
.ko-labels{margin:10px 0;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:14px}
.ko-labels ul{list-style:none;padding:0;margin:4px 0;display:flex;flex-wrap:wrap;gap:6px}
.ko-labels li{border:1px solid var(--border);border-radius:6px;padding:2px 8px;background:var(--card)}
.prep ul{list-style:none;padding:0;margin:6px 0}
.prep-item{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.prep-item input{width:22px;height:22px;accent-color:var(--accent-bg);flex:none;margin:0}
.btn.ready{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--accent-bg)}
.ask-form{display:flex;gap:8px;margin:8px 0}
.ask-form input{flex:1;min-width:0;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:16px}
.ask-btn{flex:none}
.mini{padding:10px;margin:8px 0;font-size:13px}
.mini .result-head strong{font-size:15px}
.bubble .card{color:var(--text)}
.bubble ul{padding-left:18px;margin:4px 0}

/* 발표 모드 해설 카드 (옅은 노랑) */
.present-card{background:var(--present-bg);color:var(--present-tx);border:1px solid var(--present-bd);border-radius:12px;padding:12px 16px;margin:12px 0;font-size:14px;line-height:1.55}
.present-card h4{margin:10px 0 2px;font-size:15px}
.present-card p{margin:2px 0}
.present-tag{font-size:12px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;opacity:.85}
.flow{list-style:none;padding:0;margin:6px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;counter-reset:f}
.flow li{background:var(--card);color:var(--text);border:1px solid var(--present-bd);border-radius:8px;padding:8px;font-size:13px;font-weight:600;position:relative}
.flow li::before{counter-increment:f;content:counter(f) ". "}
.flow li:not(:last-child)::after{content:"→";position:absolute;right:-8px;top:50%;transform:translate(50%,-50%);font-weight:800;color:var(--present-tx)}
@media (max-width:600px){.flow{grid-template-columns:1fr 1fr}.flow li::after{display:none}}
/* S6 */
.future{font-size:14px}
.checklist{list-style:none;padding:0;margin:8px 0;counter-reset:c}
.checklist li{display:flex;gap:10px;align-items:center;min-height:44px;padding:8px 0;border-bottom:1px solid var(--border);font-weight:600}
.checklist li::before{counter-increment:c;content:counter(c);flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line-off);display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:var(--sub)}

/* INFO·저장 */
.info-sec h3{margin-bottom:6px}
.info-badges{margin:0}
.info-badges dt{margin-top:10px}
.info-badges dd{margin:4px 0 0;font-size:14px;color:var(--sub)}
.info-list{padding-left:20px;margin:6px 0}
.info-list li{margin:4px 0}
.switch{display:flex;align-items:center;gap:10px;min-height:48px;width:100%;padding:8px 12px;margin:10px 0 4px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-weight:700;cursor:pointer;text-align:left}
.knob{width:40px;height:24px;border-radius:12px;background:var(--line-off);position:relative;flex:none}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"] .knob{background:var(--accent-bg)}
.switch[aria-checked="true"] .knob::after{left:19px}
.sw-state{margin-left:auto;font-size:13px;color:var(--sub);font-weight:600}
.ask{border:1px dashed var(--border);border-radius:10px;padding:10px 12px;margin:8px 0}

/* 인쇄: 비교표만 A4 가로 1장 (배너·모드·기준일·범례 포함, 버튼·해설 숨김) */
@media print{
  :root{--bg:#fff;--card:#fff;--text:#000;--sub:#333;--border:#999;--accent:#C3002F;--accent-bg:#C3002F;
    --banner-bg:#FFF4CC;--banner-text:#6B4E00;--vbanner-bg:#E6F4EA;--vbanner-text:#1E6B34;
    --st-verified-bg:#E6F4EA;--st-verified-tx:#1E6B34;--st-assumed-bg:#FFF4CC;--st-assumed-tx:#6B4E00;
    --st-public-bg:#E7EEFB;--st-public-tx:#1F4E9C;--st-reported-bg:#F1E8FB;--st-reported-tx:#5B2B8A;
    --st-pending-bg:#F1F2F5;--st-pending-tx:#4A4F55;--st-blocked-bg:#ECEEF1;--st-blocked-tx:#202020;
    --warn-bg:#FFF3E0;--warn-text:#7A4600}
  @page{size:A4 landscape;margin:8mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:11px;background:#fff}
  .no-print,.presenter,.cmp-cards{display:none!important}
  .cmp-table{display:table!important;page-break-inside:avoid}
  .cmp-table td{font-size:10px;padding:5px}
  .rowbtn{text-decoration:none;min-height:0}
  .banner{font-size:11px;padding:4px 0}
  h2{font-size:16px;margin:6px 0}
  .wrap{max-width:none}
  .small{font-size:10px}
}

function buildLive(guidance) {
  const d = JSON.parse(JSON.stringify(guidance));
  const get = (r, id) => r.stages.find(s => s.id === id);
  const route = id => d.routes.find(r => r.id === id);
  d.routes.forEach(r => {
    r.partner = null; // 제휴 계약 없음 — 공식 주소만
    r.stages.forEach(s => {
      s.evidence = s.evidence.filter(e => e.kind !== 'assumption');
      if (s.bypass) s.bypass = { documented: true, verified: false, label: s.bypass.label, evidence: [ev({kind: 'public_source', sourceLabel: B('Baemin official guide', '배민 공식 안내'), sourceUrl: 'https://ceo.baemin.com/knowhow/12885', publishedAt: '2024-07'})], replacementStageIds: s.bypass.replacementStageIds };
      if (s.status === 'verified') s.status = 'tested';
      else if (s.status !== 'blocked') s.status = s.evidence.some(e => e.kind === 'interview') ? 'reported' : s.evidence.some(e => e.kind === 'public_source') ? 'guide' : 'unknown';
      s.evidence.forEach(e => { if (e.observedScope && /not tried by our team/.test(e.observedScope.en)) e.observedScope = B('Described in the article', '기사 설명'); });
    });
  });
  // 배민 비회원 주문: 인터뷰 진술 + 지금 이 방법으로 주문하는 학생
  const bm = route('baemin_food');
  const interview = get(bm, 'D-R2b').evidence.find(e => e.kind === 'interview');
  interview.sourceLabel = B('Student interview', '학생 인터뷰');
  ['D-R2a', 'D-R2b'].forEach(id => { const s = get(bm, id); s.status = 'guide'; s.evidence = [ev({kind: 'public_source', sourceLabel: B('Baemin official guide', '배민 공식 안내'), sourceUrl: 'https://ceo.baemin.com/knowhow/12885', publishedAt: '2024-07'}), interview]; s.note = B('Official support and one student report; no team payment test. Availability depends on the order and payment method.', '공식 지원 안내와 학생 1명 진술. 팀 결제 미검증이며 주문·결제수단에 따라 이용 가능 여부가 달라집니다.'); });
  // 선불 유심 우회: 근거는 공개 안내, SMS 인증 통과 여부는 이용자 보고로 채운다
  ['naver_reservation', 'naver_goods', 'coupang_goods'].forEach(id => {
    get(route(id), 'D-SIM').status = 'unknown'; get(route(id), 'D-SIM').note = B("Not reported yet whether a prepaid number passes each platform's SMS check — tell us if it worked.",
      '선불 번호로 각 플랫폼 SMS 인증이 되는지는 아직 보고가 없습니다 — 됐다면 알려 주세요.');

function fmtDate(ms) {
  const d = new Date(ms); const z = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());

// 저장소 값은 믿지 않는다: 허용된 값만 골라 담아, 손상·변조된 값이 화면이나 판단에 섞이지 않게 한다
function sanitizeConds(x) {
  if (!x || typeof x !== 'object') return null;
  const c = emptyConds();
  if (CONFIG.platforms.includes(x.platform)) c.platform = x.platform;
  if (CONFIG.goals.includes(x.goal)) c.goal = x.goal;
  if (x.arc === 'none' || x.arc === 'have') c.arc = x.arc;
  ['foreignCard', 'sms', 'contact', 'payMethod'].forEach(k => { if (['yes', 'no', 'unsure', 'unknown'].includes(x[k])) c[k] = x[k]; });
  if (['visa', 'master', 'jcb', 'unionpay'].includes(x.cardBrand)) c.cardBrand = x.cardBrand;
  if (x.wallets && typeof x.wallets === 'object') CONFIG.wallets.forEach(w => { c.wallets[w] = x.wallets[w] === true; });
  c.payAnswered = x.payAnswered === true; c.cash = x.cash === true;
  if (['no', 'waiting', 'yes'].includes(x.arcDetail)) c.arcDetail = x.arcDetail;
  return c;
}
function knownIds() {
  const routes = new Set(), stages = new Set();
  Object.values(CONFIG.datasets).forEach(d => d.routes.forEach(r => { routes.add(r.id); r.stages.forEach(s => stages.add(s.id)); }));
  return { routes, stages };
}
function sanitizeCounts(x) {
  const out = emptyCounts(); const ids = knownIds();
  const pick = (src, allowed, dst) => { if (src && typeof src === 'object') for (const [k, v] of Object.entries(src)) if (allowed.has(k) && Number.isInteger(v) && v > 0) dst[k] = v; };
  if (x && typeof x === 'object') { pick(x.routeShown, ids.routes, out.routeShown); pick(x.stuckAt, ids.stages, out.stuckAt); }
  return out;
}

function loadStore() {
  let raw = null;
  try {
    if (localStorage.getItem(OLD_KEY) !== null) { localStorage.removeItem(OLD_KEY); addFlash('v1Removed'); }
    raw = localStorage.getItem(CONFIG.storageKey);
  } catch (e) { storageFailed(); return null; }
  let o = null;
  try { o = raw ? JSON.parse(raw) : null; } catch (e) { o = null; }
  if (!o || o.version !== 2) return null;
  if (o.lang === 'en' || o.lang === 'ko') state.lang = o.lang;
  if (o.consent === 'yes' || o.consent === 'no') state.consent = o.consent;
  if (state.consent === 'yes' && typeof o.anonId === 'string' && /^[a-z0-9-]{8,40}$/i.test(o.anonId)) state.anonId = o.anonId;
  if (o.remember === false) state.remember = false;
  const now = Date.now();
  if (o.improve === true) {
    if (typeof o.improveExpiresAt === 'number' && o.improveExpiresAt > now) {
      state.improve = true; state.improveExpiresAt = o.improveExpiresAt; state.counts = sanitizeCounts(o.counts);
    } else addFlash('improveExpired');
  }
  if (o.remember === true) {
    if (typeof o.expiresAt === 'number' && o.expiresAt > now) { state.remember = true; state.expiresAt = o.expiresAt; return { choices: o.choices, progress: o.progress }; }
    addFlash('expiredNote');
  }

/* ---------- 3. 문장 해석 (규칙 기반) ---------- */
// 실시간 조회·카드 승인 판단은 하지 않는다. 키워드·부정문·상충만 다루고, 모호하면 '모름'으로 둔다.
const KW = {
  platform: { coupang: /coupang|쿠팡/, naver: /naver|네이버/, baemin: /baemin|배민|배달\s*의\s*민족/ },
  goal: { online_goods: /laptop|노트북|shopping|쇼핑/, food_delivery: /food|delivery|배달|음식/, reservation: /booking|reservation|예약/ },
  arcNone: /\b(?:don'?t|do\s+not|doesn'?t|haven'?t|have\s+not|not)\s+(?:have\s+|got\s+|get\s+)?(?:an?\s+|my\s+)?arc\b|\bno\s*arc\b|\bwithout\s*(?:an?\s+|my\s+)?arc\b|\bwaiting\b|\barc\s*(?:카드\s*)?(?:가\s*|이\s*)?(?:아직\s*)?(?:없|대기|못\s*받|안\s*나)\S*|대기\s*중?|아직\s*arc/,
  arcHave: /\b(?:got|have|has|received)\s*(?:my\s+|an?\s+)?arc\b|\barc\s*(?:카드\s*)?(?:를\s*|을\s*|가\s*|이\s*)?(?:받았|있)\S*/,
  foreignCard: /foreign\s*card|overseas\s*card|international\s*card|해외\s*(?:발급\s*)?카드|외국\s*카드/,
  brand: { visa: /\bvisa\b|비자/, master: /master\s*card|\bmaster\b|마스터/, jcb: /\bjcb\b/, unionpay: /union\s*pay|유니온\s*페이/ },
  wallet: { alipay: /ali\s*pay|알리\s*페이/, wechat: /we\s*chat|위챗/, applepay: /apple\s*pay|애플\s*페이/ },
  sms: /sms\s*(?:is\s*)?(?:available|ok|가능|수신)|(?:can|able\s+to)\s*(?:receive|get)\s*(?:an?\s+)?sms|receive\s*sms|문자\s*(?:를\s*)?(?:받을\s*수\s*있|수신|받|가능)/,
  contact: /contact\s*number|reachable|연락\s*(?:가능|번호|처|받)/,
  negEn: /\b(?:don'?t|do\s+not|doesn'?t|does\s+not|didn'?t|did\s+not|not|no|without|haven'?t|have\s+not|hasn'?t|never|can'?t|cannot|lack|none)\b/,

function emptyConds() {

    // 버튼 질문용: 결제 수단 질문에 답했는지, 현금 보유(경로 판단에는 쓰지 않음), ARC 답의 세부(없음/기다리는 중)
    payAnswered: false, cash: false, arcDetail: null };
}

function parseSentence(raw) {

  for (const cl of clauses) {
    if (!cl || !cl.trim()) continue;
    // 플랫폼·목적은 부정문에 영향받지 않는다("쿠팡 가입이 안 돼요"도 쿠팡 이야기)
    for (const [p, re] of Object.entries(KW.platform)) if (re.test(cl)) hit.platform.add(p);
    for (const [g, re] of Object.entries(KW.goal)) if (re.test(cl)) hit.goal.add(g);
    let rest = cl;
    // ARC '없음' 표현을 먼저 지운다 — "no ARC"의 no가 같은 절의 다른 항목을 부정한 것으로 읽히지 않게

  if (hit.arc.has('none') && hit.arc.has('have')) notes.conflicts.push(t('c_arc'));

    if (has && negd) notes.conflicts.push(t(labelOf[k]));

function autoGoal(c) {

  if (!c.goal && c.platform === 'baemin') c.goal = 'food_delivery';
}

function summaryText(c) {
  const parts = [];
  if (c.platform) parts.push(pName(c.platform));
  if (c.goal) parts.push(gName(c.goal));
  if (c.arc) parts.push(t('arc_' + c.arc));
  if (c.foreignCard === 'yes') parts.push(t('s_card'));
  if (c.cardBrand) parts.push(t('b_' + c.cardBrand));
  CONFIG.wallets.forEach(w => { if (c.wallets[w]) parts.push(t('w_' + w)); });
  if (c.cash) parts.push(t('pay_cash'));
  if (c.sms === 'yes') parts.push(t('s_sms'));

/* ---------- 4. matchRoute — S3와 S5가 같은 함수를 쓴다 ---------- */
// 실행 안내 가능한 상태: verified, assumed(demo에서만). public·reported·pending은 근거만 보여 주고 멈춘다.
// 실사용: 막힌 단계 말고는 모두 안내한다(근거 수준은 배지와 출처 줄로 보여 주고, 보고가 없으면 결과를 묻는다)

// 요구 조건 값: 'yes' | 'no' | 'unsure' | 'unknown'. 'yes'가 아니면 모두 미충족.
function reqValue(key, c) {
  if (!c) return 'unknown';
  switch (key) {
    case 'sms': return c.sms;
    case 'contact': return c.contact;
    case 'foreignCard': return c.foreignCard;
    case 'payMethod':
      if (c.foreignCard === 'yes' || CONFIG.wallets.some(w => c.wallets[w])) return 'yes';
      return c.payMethod;
    default: return 'unknown'; // 실행 안내 단계에 없는 조건(명의 등)은 묻지도 채우지도 않는다

function matchRoute(route, c, mode) {
  const base = { route, noConds: !c, steps: [], stop: null, met: [], demo: false, guidedCount: 0, paymentVerified: false, type: 'C' };
  if (!route) return base;

  for (let i = 0, guard = 0; i < route.stages.length && guard < 100; guard++) {
    const s = route.stages[i];

    if (s.detour && reqValue(s.detour.when, c) !== 'no') { i++; continue; }
    if (stop) { steps.push({ stage: s, state: 'after' }); i++; continue; }
    if (s.status === 'blocked') {
      // 막힌 단계는 이 모드에서 허용된 우회가 있을 때만 대체 단계로 잇는다
      if (bypassAllowed(s.bypass, mode)) {
        const j = ids.indexOf(s.bypass.replacementStageIds[0]);
        if (j > i) { steps.push({ stage: s, state: 'skipped', bypass: s.bypass }); i = j; continue; }
      }
      stop = { reason: 'blocked', stage: s, missing: [] };
      steps.push({ stage: s, state: 'stopped', reason: 'blocked' }); i++; continue;
    }
    if (!isExecutable(s, mode)) {

    }
    const missing = s.requirements.filter(k => !provided.includes(k) && reqValue(k, c) !== 'yes').concat(s.excludes.filter(k => excludedBy(k, c)));
    if (missing.length) {

      steps.push({ stage: s, state: 'stopped', reason: 'unmet', missing }); i++; continue;
    }
    s.requirements.forEach(k => { if (!provided.includes(k) && !met.includes(k)) met.push(k); });
    s.provides.forEach(k => { if (!provided.includes(k)) provided.push(k); }); // 우회 단계를 마치면 원래 단계의 조건이 채워진다

}

/* ---------- 보충 질문 ---------- */
// 범위: 실행 안내 가능한 단계를 처음부터 따라가며, 안내가 멈추는 첫 단계의 비어 있는 조건만 묻는다.

// 결제 수단은 답했거나 문장에서 '있음'으로 채워졌으면 다시 묻지 않는다(부정문은 채워지지 않으므로 묻는다)
function payFilled(c) { return c.payAnswered || c.foreignCard === 'yes' || CONFIG.wallets.some(w => c.wallets[w]); }
// 순서: 플랫폼 → (네이버만) 목적 → ARC → 결제 수단 → 경로에 필요할 때만 SMS/주문 연락.
// 기본 3개(플랫폼·ARC·결제 수단)이고 목적·SMS/연락은 필요할 때만 더한다.
function nextQuestion() {
  const c = state.conds; if (!c) return null;
  if (!c.platform) return c.goal ? null : 'goal'; // 플랫폼 없는 문장 → 목적만 확인하고 S5 비교표로(기존)
  if (!c.goal) return 'goal';
  if (!c.arc) return 'arc';
  if (c.arc === 'have') return null; // ARC 있음 → 확인 후 ARC 이후 화면으로(기존)

function refreshQuestion() {
  const q = nextQuestion();

  if (last && last.kind === 'q') { if (last.key === q) { state.pendingQ = q; return; } state.chat.pop(); }
  if (q) state.chat.push({ who: 'bot', kind: 'q', key: q });
  state.pendingQ = q;
}
function questionText(q) {
  if (q === 'goal') return state.conds && state.conds.platform ? t('q_goal_p', { p: pName(state.conds.platform) }) : t('q_goal');
  return t('q_' + q);
}
const goalShort = g => t(g === 'online_goods' ? 'opt_shopping' : g === 'reservation' ? 'opt_booking' : 'opt_food');
const PAY_OPTS = ['card', 'alipay', 'wechat', 'applepay', 'cash'];
const payLabel = o => o === 'card' ? t('pay_card') : o === 'cash' ? t('pay_cash') : t('w_' + o);
function answerLabel(q, v) {
  if (q === 'platform') return pName(v);
  if (q === 'goal') return state.conds && state.conds.platform ? goalShort(v) : gName(v);

/* ---------- 5. 화면 ---------- */
const $banner = document.getElementById('banner');

// 해시에는 화면 이름만. 상태 없는 중간 해시는 S1로 보낸다.
function resolveScreen() {
  switch (location.hash) {
    case '#/start': return 'start';
    case '#/compare': return 'compare';
    case '#/info': return 'info';
    case '#/arc': return 'arc';
    case '#/survey': return 'survey';
    case '#/talk': return state.conds ? 'talk' : null;
    case '#/result': return state.result ? 'result' : null;
    case '#/steps': return state.result && state.steps && state.result.guidedCount > 0 ? 'steps' : null;
    default: return null;

function render() {
  let scr = resolveScreen();
  if (!scr) { history.replaceState(null, '', '#/start'); scr = 'start'; }
  const prevFid = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-fid');
  document.documentElement.lang = state.lang;
  try {
    renderChrome();
    const view = { start: viewStart, talk: viewTalk, result: viewResult, steps: viewSteps, compare: viewCompare, info: viewInfo, arc: viewArc, survey: viewSurvey }[scr]();
    // 발표 모드: 화면 맨 위에 해설 카드만 덧붙인다(데이터·조건·판단은 그대로)
    $main.replaceChildren(...(state.present ? [presentCard(scr)] : []), view);
  } catch (err) {
    // 빈 화면 금지: 무엇이 잘못돼도 안내와 [초기화] 버튼을 보여 준다
    showLoadFail(err); return;
  }
  document.title = 'Nubi';
  const changed = scr !== lastScreen;
  const want = state.focusFid || (!changed ? prevFid : null);
  if (changed && lastScreen !== null) {
    window.scrollTo(0, 0);
    const h = $main.querySelector('h1, h2');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
  if (want) { const n = document.querySelector('[data-fid="' + want + '"]'); if (n) n.focus({ preventScroll: !state.focusFid }); }
  state.focusFid = null; state.flash = null;
  lastScreen = scr;

}

/* 불러오기 실패 안내: 앱 함수(el·t)에 기대지 않고 DOM만으로 그린다 — 그 함수가 고장 난 경우에도 보이게 */

// 표 칸용 짧은 근거. 배지가 이미 말하는 것(가정·팀 확인)은 반복하지 않아 표가 한 화면에 들어가게 한다.

// 날짜 경고는 가정 단계에 쓰지 않는다(가정은 날짜로 신뢰도가 바뀌지 않음)
function staleDate(s, e) {

/* 세로 노선도: 안내 가능 구간은 실선(강조색), 멈추는 단계부터 점선 회색, 맨 아래 도착역 */

  let gi = -1;
  res.steps.forEach((en, k) => {

    if (en.state === 'guided') {

        } else if (gi < cur.idx || cur.phase !== 'steps') { cls += ' done'; tag.push(t('doneStep')); }
      }
    }
    if (en.stage.detour) { cls += ' detour'; tag.push(L(en.stage.detour.label)); }
    const next = res.steps[k + 1];

  const ws = CONFIG.wallets.filter(w => KW.wallet[w].test(text));
  const brand = Object.keys(KW.brand).find(b => KW.brand[b].test(text)) || null;
  const card = KW.foreignCard.test(text) || /\bcards?\b|카드/.test(text) || !!brand;
  const sms = /\bsms\b|문자/.test(text);

    CONFIG.wallets.forEach(w => changes.push({ key: 'wallet', w, value: ws.includes(w) }));

    changes.push({ key: 'cardBrand', value: brand });

  const weakest = ss.reduce((a, b) => (rankOf(b.status) > rankOf(a.status) ? b : a));
  const kids = [el('div', { class: 'badges' }, statusBadge(weakest))];
  ss.forEach(s => { if (s.status === 'blocked' && bypassAllowed(s.bypass, state.mode))
    kids.push(el('p', { class: 'cell-line' }, el('strong', {}, t(s.bypass.assumed ? 'bypassCell' : 'bypassCellV', { x: L(s.bypass.label) })))); });

function restart() { freshState(); state.focusFid = 'q'; go('#/start'); }
function setLang(l) { if (state.lang === l) return; state.lang = l; savePrefs(); render(); }
// 모드 전환: 다른 데이터로 만든 결과는 무효 → 같은 조건으로 다시 판단. 새로 필요한 질문이 생기면 대화로 돌아가 묻는다.
function setMode(m) {
  if (m !== 'live') return;
  if (state.mode === m) return;
  state.mode = m; savePrefs(); addFlash('modeChanged');
  const scr = resolveScreen();
  state.steps = null; state.transfer = null; state.prep = null; state.askLog = [];
  if (state.conds) refreshQuestion();
  if (state.result) {
    const r = state.result.route;
    state.result = matchRoute(r ? findRoute(r.platform, r.goal) : null, state.result.noConds ? null : state.conds, m);
  }
  if (scr === 'info') {
    // INFO에서 바꿔도 같은 규칙: 닫았을 때 돌아갈 곳을 다시 판단한 결과로 맞춘다
    const ret = state.infoReturn;
    if ((ret === '#/result' || ret === '#/steps') && state.pendingQ && state.result && !state.result.noConds) { state.confirmed = false; state.infoReturn = '#/talk'; }
    else if (ret === '#/steps') state.infoReturn = '#/result';
    render(); return;
  }
  if ((scr === 'result' || scr === 'steps') && state.pendingQ && !state.result.noConds) { state.confirmed = false; go('#/talk'); return; }
  if (scr === 'steps') { go('#/result'); return; }
  render();
}

window.addEventListener('hashchange', render);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && resolveScreen() === 'info') closeInfo(); });
try {
  const saved = loadStore();
  if (saved) restoreSaved(saved);
  writeStore(); // 만료 삭제를 즉시 반영하고, 저장이 막힌 브라우저면 첫 화면에서 안내한다
  if (!location.hash) history.replaceState(null, '', '#/start');
  render();
} catch (err) { showLoadFail(err); }
window.__payPathReady = true;
</script>
<script>
(function () {
  function fallback() {
    if (window.__payPathReady) return;
    var ko = (navigator.language || '').toLowerCase().indexOf('ko') === 0;
    var m = document.getElementById('main'); if (!m) return;
    m.innerHTML = '';
    var p = document.createElement('p');
    p.textContent = ko ? '불러오기에 실패했습니다. 설정에서 초기화하거나 백업을 복원하세요.' : 'Loading failed. Reset in Settings or restore a backup.';
    var b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-primary btn-block';
    b.textContent = ko ? '초기화' : 'Reset';
    b.onclick = function () {
      try { localStorage.removeItem('paypath:report-review:v1'); localStorage.removeItem('paypath:v1'); } catch (e) {}
      location.replace(location.pathname + location.search);
    };
    m.appendChild(p); m.appendChild(b);
  }
  if (document.readyState === 'complete') fallback(); else window.addEventListener('load', fallback);
})();
</script>
</body>
</html>
